                { id: 'footer', label: '푸터 관리', icon: 'fa-window-maximize' },
                { id: 'consultations', label: '상담 내역', icon: 'fa-clipboard-list' },
                { id: 'integration', label: '구글 연동', icon: 'fa-link' }
            ];

            return (
                <div className="min-h-screen bg-gray-100 flex">
                    <aside className="w-64 bg-gray-900 text-white flex flex-col admin-sidebar">
                        <div className="p-8 border-b border-white/10">
                            <div className="text-xl font-black italic text-ktRed">KT ADMIN</div>
                        </div>
                        <nav className="p-4 space-y-1 flex-grow overflow-y-auto">
                            {TABS.map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition-all ${tab === t.id ? 'bg-ktRed text-white shadow-lg' : 'hover:bg-white/5 text-gray-400'}`}>
                                    <i className={`fa-solid ${t.icon} w-5`}></i> {t.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/10">
                            <button onClick={onLogout} className="w-full flex items-center justify-center gap-2 p-3 bg-white/5 hover:bg-white/10 rounded-lg text-sm text-gray-400 transition-colors">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
                            </button>
                        </div>
                    </aside>

                    <main className="flex-grow p-10 overflow-y-auto">
                        <header className="mb-10">
                            <h1 className="text-3xl font-black text-gray-900">{TABS.find(t=>t.id===tab).label}</h1>
                        </header>
                        
                        {tab === 'content' && (
                            <div className="bg-white p-8 rounded-2xl border shadow-sm space-y-8 max-w-4xl">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="space-y-4">
                                        <label className="block text-xs font-bold text-gray-400 uppercase">상단 띠배너 공지</label>
                                        <textarea rows={3} value={settings.announcement} onChange={e => setSettings({...settings, announcement: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-ktRed/20" />
                                    </div>
                                    <div className="space-y-4">
                                        <label className="block text-xs font-bold text-gray-400 uppercase">히어로 메인 제목</label>
                                        <input type="text" value={settings.heroTitle} onChange={e => setSettings({...settings, heroTitle: e.target.value})} className="w-full p-3 border rounded-lg" />
                                        <label className="block text-xs font-bold text-gray-400 uppercase pt-2">히어로 배경 이미지</label>
                                        <input type="file" onChange={e => handleFile(e, u => setSettings({...settings, heroImageUrl: u}))} className="text-xs" />
                                    </div>
                                </div>
                                <button onClick={() => alert('설정이 임시 저장되었습니다.')} className="bg-ktRed text-white px-8 py-3 rounded font-bold shadow-lg">전체 저장</button>
                            </div>
                        )}

                        {tab === 'news' && (
                            <div className="space-y-6">
                                <button onClick={() => setEditNews({})} className="bg-gray-900 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2"><i className="fa-solid fa-plus"></i> 신규 뉴스 추가</button>
                                <div className="bg-white rounded-2xl border divide-y overflow-hidden shadow-sm">
                                    {news.map(n => (
                                        <div key={n.id} className="p-6 flex items-center justify-between hover:bg-gray-50 transition-colors">
                                            <div className="flex items-center gap-6">
                                                <img src={n.imageUrl} className="w-16 h-16 object-cover rounded-lg border shadow-sm" /> 
                                                <div>
                                                    <div className="font-bold text-lg">{n.title}</div>
                                                    <div className="text-xs text-gray-400 font-mono">{n.date}</div>
                                                </div>
                                            </div>
                                            <div className="flex gap-4">
                                                <button onClick={() => setEditNews(n)} className="text-blue-500 font-bold hover:underline">수정</button>
                                                <button onClick={() => confirm('삭제하시겠습니까?') && setNews(news.filter(x => x.id !== n.id))} className="text-red-500 font-bold hover:underline">삭제</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'products' && (
                            <div className="space-y-6">
                                <button onClick={() => setEditProd({})} className="bg-gray-900 text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2"><i className="fa-solid fa-plus"></i> 상품 추가</button>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {products.map(p => (
                                        <div key={p.id} className="bg-white p-6 border rounded-2xl flex justify-between shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex gap-4">
                                                <img src={p.image} className="w-20 h-20 object-cover rounded-xl border" /> 
                                                <div>
                                                    <div className="font-bold text-xl">{p.name}</div>
                                                    <div className="text-xs text-blue-500 font-mono truncate max-w-[150px]">{p.linkUrl}</div>
                                                </div>
                                            </div>
                                            <div className="flex flex-col gap-2">
                                                <button onClick={() => setEditProd(p)} className="p-2 text-gray-400 hover:text-ktRed"><i className="fa-solid fa-pen-to-square"></i></button>
                                                <button onClick={() => confirm('삭제?') && setProducts(products.filter(x => x.id !== p.id))} className="p-2 text-gray-400 hover:text-red-500"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'buttons' && (
                            <div className="bg-white p-8 rounded-2xl border shadow-sm space-y-6 max-w-2xl">
                                {Object.keys(settings.buttonLabels).map(key => (
                                    <div key={key}>
                                        <label className="block text-xs font-bold text-gray-400 uppercase mb-2">{key}</label>
                                        <input type="text" value={settings.buttonLabels[key]} onChange={e => setSettings({...settings, buttonLabels: {...settings.buttonLabels, [key]: e.target.value}})} className="w-full p-3 border rounded-lg" />
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'footer' && (
                            <div className="bg-white p-8 rounded-2xl border shadow-sm space-y-6 max-w-2xl">
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-2">하단 설명 문구</label>
                                    <textarea rows={4} value={settings.footer.description} onChange={e => setSettings({...settings, footer: {...settings.footer, description: e.target.value}})} className="w-full p-3 border rounded-lg" />
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    <div><label className="text-xs font-bold text-gray-400">상담번호</label><input type="text" value={settings.footer.supportPhone} onChange={e => setSettings({...settings, footer: {...settings.footer, supportPhone: e.target.value}})} className="w-full p-2 border" /></div>
                                    <div><label className="text-xs font-bold text-gray-400">본부번호</label><input type="text" value={settings.footer.hqPhone} onChange={e => setSettings({...settings, footer: {...settings.footer, hqPhone: e.target.value}})} className="w-full p-2 border" /></div>
                                    <div><label className="text-xs font-bold text-gray-400">장애번호</label><input type="text" value={settings.footer.faultPhone} onChange={e => setSettings({...settings, footer: {...settings.footer, faultPhone: e.target.value}})} className="w-full p-2 border" /></div>
                                </div>
                            </div>
                        )}

                        {tab === 'consultations' && (
                            <div className="bg-white rounded-2xl border shadow-sm overflow-hidden">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-gray-50 border-b text-gray-400 font-bold uppercase">
                                        <tr>
                                            <th className="p-4">신청일시</th>
                                            <th className="p-4">매장명</th>
                                            <th className="p-4">고객성함</th>
                                            <th className="p-4">연락처</th>
                                            <th className="p-4">관심품목</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {consultations.length > 0 ? consultations.map(c => (
                                            <tr key={c.id} className="hover:bg-gray-50 transition-colors">
                                                <td className="p-4 text-xs font-mono text-gray-400">{c.createdAt}</td>
                                                <td className="p-4 font-bold">{c.storeName}</td>
                                                <td className="p-4">{c.customerName}</td>
                                                <td className="p-4 font-mono">{c.phoneNumber}</td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap gap-1">
                                                        {c.interests.map(i => <span key={i} className="px-1.5 py-0.5 bg-ktRed/5 text-ktRed text-[10px] font-bold rounded border border-ktRed/10">{i}</span>)}
                                                    </div>
                                                </td>
                                            </tr>
                                        )) : (
                                            <tr><td colSpan={5} className="p-20 text-center text-gray-400">상담 내역이 없습니다.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {tab === 'integration' && (
                            <div className="space-y-8 max-w-3xl">
                                <div className="bg-white p-8 rounded-2xl border shadow-sm">
                                    <h3 className="text-lg font-bold mb-6 flex items-center gap-2"><i className="fa-solid fa-bolt text-yellow-500"></i> 외부 연동 설정 (Webhook)</h3>
                                    <div className="space-y-4">
                                        <label className="block text-xs font-bold text-gray-400 uppercase">Google Apps Script Web App URL</label>
                                        <input type="text" value={settings.webhookUrl} onChange={e => setSettings({...settings, webhookUrl: e.target.value})} className="w-full p-4 border rounded-xl font-mono text-sm bg-gray-50" placeholder="https://script.google.com/macros/s/.../exec" />
                                        <p className="text-xs text-gray-500">신청 시 구글 시트 및 이메일 전송을 위한 API 주소를 입력하세요.</p>
                                    </div>
                                </div>
                                <div className="bg-blue-50 p-8 rounded-2xl border border-blue-100 text-sm text-blue-900">
                                    <h4 className="font-bold mb-4 flex items-center gap-2"><i className="fa-solid fa-circle-info"></i> 구글 시트/메일 연동 가이드</h4>
                                    <ol className="list-decimal ml-4 space-y-3 leading-relaxed">
                                        <li>구글 시트를 생성하고 <b>확장 프로그램 &gt; Apps Script</b>를 엽니다.</li>
                                        <li>아래 코드를 복사하여 붙여넣고 <b>배포 &gt; 새 배포 (웹 앱)</b>를 실행합니다.</li>
                                        <li>액세스 권한을 "모든 사람(Anyone)"으로 설정하고 URL을 위 필드에 입력하세요.</li>
                                    </ol>
                                    <pre className="mt-6 p-4 bg-white/50 rounded-lg text-[10px] font-mono border overflow-x-auto">
{`function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);
  sheet.appendRow([new Date(), data.storeName, data.customerName, data.phoneNumber, data.interests.join(", ")]);
  
  // 메일 알림 (선택 사항)
  MailApp.sendEmail({
    to: "본인이메일@gmail.com",
    subject: "[상담신청] " + data.storeName,
    body: "매장: " + data.storeName + "\\n성함: " + data.customerName + "\\n번호: " + data.phoneNumber
  });
  
  return ContentService.createTextOutput("OK");
}`}
                                    </pre>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modals for News/Products */}
                    {editNews && (
                        <div className="fixed inset-0 z-[120] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
                            <form onSubmit={(e) => { 
                                e.preventDefault(); 
                                if (editNews.id) {
                                    setNews(news.map(n => n.id === editNews.id ? editNews : n));
                                } else {
                                    setNews([{...editNews, id: Date.now().toString(), date: new Date().toISOString().split('T')[0]}, ...news]);
                                }
                                setEditNews(null); 
                            }} className="bg-white p-10 rounded-3xl w-full max-w-xl shadow-2xl space-y-6">
                                <h2 className="text-2xl font-black">{editNews.id ? '뉴스 수정' : '신규 뉴스 등록'}</h2>
                                <input type="text" required placeholder="뉴스 제목" value={editNews.title || ''} onChange={e => setEditNews({...editNews, title: e.target.value})} className="w-full p-4 bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-ktRed" />
                                <textarea required placeholder="뉴스 내용" rows={6} value={editNews.content || ''} onChange={e => setEditNews({...editNews, content: e.target.value})} className="w-full p-4 bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-ktRed" />
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-gray-400">대표 이미지 업로드</label>
                                    <input type="file" onChange={e => handleFile(e, u => setEditNews({...editNews, imageUrl: u}))} className="text-xs" />
                                </div>
                                <div className="flex gap-4 pt-4">
                                    <button type="submit" className="flex-grow bg-ktRed text-white p-4 rounded-xl font-bold shadow-lg">저장</button>
                                    <button type="button" onClick={() => setEditNews(null)} className="px-8 bg-gray-100 p-4 rounded-xl font-bold">취소</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {editProd && (
                        <div className="fixed inset-0 z-[120] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
                            <form onSubmit={(e) => { 
                                e.preventDefault(); 
                                if (editProd.id) {
                                    setProducts(products.map(p => p.id === editProd.id ? editProd : p));
                                } else {
                                    setProducts([...products, {...editProd, id: Date.now().toString()}]);
                                }
                                setEditProd(null); 
                            }} className="bg-white p-10 rounded-3xl w-full max-w-xl shadow-2xl space-y-6 overflow-y-auto max-h-[90vh]">
                                <h2 className="text-2xl font-black">상품 정보 설정</h2>
                                <input type="text" required placeholder="상품명" value={editProd.name || ''} onChange={e => setEditProd({...editProd, name: e.target.value})} className="w-full p-4 bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-ktRed" />
                                <textarea placeholder="상세 설명" rows={3} value={editProd.description || ''} onChange={e => setEditProd({...editProd, description: e.target.value})} className="w-full p-4 bg-gray-50 border-0 rounded-xl" />
                                <input type="text" placeholder="아이콘 클래스 (예: fa-solid fa-robot)" value={editProd.icon || ''} onChange={e => setEditProd({...editProd, icon: e.target.value})} className="w-full p-4 bg-gray-50 border-0 rounded-xl" />
                                <input type="text" placeholder="연결 링크 (예: #consultation)" value={editProd.linkUrl || ''} onChange={e => setEditProd({...editProd, linkUrl: e.target.value})} className="w-full p-4 bg-gray-50 border-0 rounded-xl" />
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-gray-400">상품 이미지 업로드</label>
                                    <input type="file" onChange={e => handleFile(e, u => setEditProd({...editProd, image: u}))} className="text-xs" />
                                </div>
                                <div className="flex gap-4 pt-4">
                                    <button type="submit" className="flex-grow bg-ktRed text-white p-4 rounded-xl font-bold shadow-lg">상품 저장</button>
                                    <button type="button" onClick={() => setEditProd(null)} className="px-8 bg-gray-100 p-4 rounded-xl font-bold">취소</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('site_settings')) || INITIAL_SETTINGS);
            const [news, setNews] = useState(() => JSON.parse(localStorage.getItem('site_news')) || INITIAL_NEWS);
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('site_products')) || INITIAL_PRODUCTS);
            const [consultations, setConsultations] = useState(() => JSON.parse(localStorage.getItem('site_consultations')) || []);

            useEffect(() => { localStorage.setItem('site_settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('site_news', JSON.stringify(news)); }, [news]);
            useEffect(() => { localStorage.setItem('site_products', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('site_consultations', JSON.stringify(consultations)); }, [consultations]);

            const handleConsultation = async (data) => {
                const entry = { ...data, id: Date.now().toString(), createdAt: new Date().toLocaleString() };
                setConsultations([entry, ...consultations]);
                if (settings.webhookUrl) {
                    try { 
                        await fetch(settings.webhookUrl, { 
                            method: 'POST', 
                            mode: 'no-cors', 
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(entry) 
                        }); 
                    } catch(e) { console.error('Webhook Error:', e); }
                }
                setShowSuccess(true);
            };

            const handleAdminAuth = (pass) => {
                if (pass === '8999') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                } else {
                    alert('비밀번호가 올바르지 않습니다.');
                }
            };

            if (isAdmin) {
                return (
                    <AdminPanel 
                        settings={settings} setSettings={setSettings} 
                        news={news} setNews={setNews} 
                        products={products} setProducts={setProducts} 
                        consultations={consultations} 
                        onLogout={() => setIsAdmin(false)} 
                    />
                );
            }

            return (
                <div className="flex flex-col min-h-screen">
                    <Navbar settings={settings} onAdminClick={() => setShowAdminLogin(true)} />
                    <main className="flex-grow">
                        <Hero settings={settings} />
                        <div className="marquee-container">
                            <div className="animate-marquee">
                                {settings.announcement} &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; {settings.announcement}
                            </div>
                        </div>
                        <ProductSection products={products} />
                        <NewsSection news={news} />
                        <ConsultationForm settings={settings} onSubmit={handleConsultation} />
                    </main>
                    <Footer settings={settings} />

                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[150] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white p-10 rounded-3xl w-full max-w-sm text-center shadow-2xl transform animate-in fade-in zoom-in duration-200">
                                <div className="text-2xl font-black mb-2">관리자 접속</div>
                                <p className="text-sm text-gray-500 mb-8">액세스 키를 입력해 주세요.</p>
                                <input 
                                    type="password" 
                                    autoFocus 
                                    placeholder="••••" 
                                    onKeyDown={e => { if(e.key==='Enter') handleAdminAuth(e.target.value); }} 
                                    className="w-full p-4 border-0 bg-gray-50 rounded-2xl text-center text-3xl tracking-[0.5em] mb-6 focus:ring-2 focus:ring-ktRed outline-none" 
                                />
                                <div className="flex flex-col gap-3">
                                    <button onClick={() => handleAdminAuth(document.querySelector('input[type="password"]').value)} className="w-full py-4 bg-gray-900 text-white font-bold rounded-2xl hover:bg-black transition-all">접속하기</button>
                                    <button onClick={() => setShowAdminLogin(false)} className="text-gray-400 text-sm hover:text-gray-600 transition-colors">닫기</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {showSuccess && <SuccessModal onClose={() => setShowSuccess(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
